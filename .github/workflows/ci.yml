# Continuous integration: lint, format and offline tests.
#
# Uses only the committed uv.lock (`--locked` fails if it is out of date; it is never
# regenerated here). Offline tests use fake models, web clients and history: no Ollama,
# MCP server, database, paid API or secret is used. PostgreSQL and live tests are
# deselected by marker and are also skipped unless their opt-in variables are set.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Every job declares its own permissions; nothing is granted by default.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Replace superseded pull-request runs; never cancel runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.26"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint and format (Ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

  offline-tests:
    name: Offline tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux, Python 3.12
            os: ubuntu-24.04
            python: "3.12"
          - label: Linux, Python 3.13
            os: ubuntu-24.04
            python: "3.13"
          # Development happens on Windows; some path-safety tests only run there.
          - label: Windows, Python 3.13
            os: windows-2025
            python: "3.13"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run offline tests (coverage is informational)
        id: tests
        run: >-
          uv run --locked pytest
          -m "not postgres and not live and not live_mcp"
          -ra
          --junit-xml=reports/ci/junit.xml
          --cov=researchpilot
          --cov-report=term
          --cov-report=xml:reports/ci/coverage.xml

      # Runs whenever the test command ran, passed or failed; fails only when the JUnit
      # report is missing or unreadable (the test step itself reports test failures).
      - name: Summarize test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          uv run --locked python - <<'EOF'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          junit = Path("reports/ci/junit.xml")


          def report(lines: list[str]) -> None:
              text = "\n".join(lines) + "\n"
              print(text, end="")
              with summary.open("a", encoding="utf-8") as out:
                  out.write(text)


          def fail(message: str) -> None:
              print(f"::error::{message}")
              report([f"**{message}**"])
              sys.exit(1)


          if not junit.is_file():
              fail("The test command ran but produced no JUnit report at reports/ci/junit.xml.")
          try:
              root = ET.parse(junit).getroot()
          except ET.ParseError:
              fail("The JUnit report at reports/ci/junit.xml could not be parsed.")

          # The root is either one <testsuite> or a <testsuites> holding one or more suites.
          # Only innermost suites are counted, so nested suites are never counted twice.
          suites = [suite for suite in root.iter("testsuite") if suite.find("testsuite") is None]
          if not suites:
              fail("The JUnit report at reports/ci/junit.xml contains no test suites.")
          keys = ("tests", "failures", "errors", "skipped")
          totals = {key: sum(int(suite.get(key) or 0) for suite in suites) for key in keys}

          report([
              "| Tests in report | Failures | Errors | Skipped by pytest |",
              "|---|---|---|---|",
              "| {tests} | {failures} | {errors} | {skipped} |".format(**totals),
              "",
              "Tests deselected by marker (postgres, live, live_mcp) are excluded on purpose:",
              "they are not run, not in the report and not counted above.",
          ])
          EOF

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-tests-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            reports/ci/junit.xml
            reports/ci/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  postgres-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # A fresh, disposable PostgreSQL for this job only. The credentials are CI-only test
    # values, not secrets; nothing here can reach a developer or production database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: researchpilot
          POSTGRES_PASSWORD: researchpilot-ci-only
          POSTGRES_DB: researchpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username researchpilot --dbname researchpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Neutral names: each step maps only the URL it needs to the variable the code reads,
      # so the tests never see the migration database as the application's database.
      CI_TEST_DATABASE_URL: postgresql+psycopg://researchpilot:researchpilot-ci-only@localhost:5432/researchpilot_test
      CI_MIGRATION_DATABASE_URL: postgresql+psycopg://researchpilot:researchpilot-ci-only@localhost:5432/researchpilot_ci
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      # Refuses to continue unless both URLs point at this job's service, then creates the
      # second database used only by the Alembic round trip.
      - name: Check database targets and create the migration database
        run: |
          uv run --locked python - <<'EOF'
          import os
          import sys

          import psycopg
          from psycopg import sql
          from sqlalchemy.engine import make_url


          def fail(message: str) -> None:
              print(f"::error::{message}")
              sys.exit(1)


          def service_url(name: str):
              raw = os.environ.get(name)
              if not raw:
                  fail(f"{name} is not set.")
              url = make_url(raw)
              if url.drivername != "postgresql+psycopg":
                  fail(f"{name} must use postgresql+psycopg://.")
              if url.host not in ("localhost", "127.0.0.1") or url.port != 5432:
                  fail(f"{name} must target this job's PostgreSQL service on localhost:5432.")
              return url


          test = service_url("CI_TEST_DATABASE_URL")
          migration = service_url("CI_MIGRATION_DATABASE_URL")
          if "test" not in (test.database or ""):
              fail("The test database name must contain 'test', as the test fixtures require.")
          if migration.database == test.database:
              fail("The migration round trip must use a different database from the tests.")

          with psycopg.connect(
              host=test.host,
              port=test.port,
              user=test.username,
              password=test.password,
              dbname=test.database,
              autocommit=True,
          ) as connection:
              encoding = connection.execute("SHOW server_encoding").fetchone()[0]
              if encoding != "UTF8":
                  fail(f"The service database encoding is {encoding}; the history layer needs UTF8.")
              exists = connection.execute(
                  "SELECT 1 FROM pg_database WHERE datname = %s", (migration.database,)
              ).fetchone()
              if exists:
                  fail("The migration database already exists; this job only uses a fresh service.")
              connection.execute(
                  sql.SQL("CREATE DATABASE {}").format(sql.Identifier(migration.database))
              )
          print(
              f"Targets verified on localhost:5432 (UTF8): tests use {test.database}, "
              f"the Alembic round trip uses {migration.database}."
          )
          EOF
        env:
          CI_TEST_DATABASE_URL: ${{ env.CI_TEST_DATABASE_URL }}
          CI_MIGRATION_DATABASE_URL: ${{ env.CI_MIGRATION_DATABASE_URL }}

      # The integration tests migrate through a passed-in connection, so this exercises the
      # operator path instead: alembic.ini and env.py reading RESEARCHPILOT_DATABASE_URL.
      - name: Migration round trip through alembic.ini (upgrade, downgrade, upgrade)
        env:
          RESEARCHPILOT_DATABASE_URL: ${{ env.CI_MIGRATION_DATABASE_URL }}
        run: |
          expected="$(uv run --locked python -c 'from researchpilot.history import EXPECTED_SCHEMA_REVISION as r; print(r)')"

          check_at_head() {
            current="$(uv run --locked alembic current --check-heads)"
            echo "Current revision: ${current}"
            if [[ "${current%% *}" != "${expected}" ]]; then
              echo "::error::Expected revision ${expected} after upgrade, found '${current}'."
              exit 1
            fi
          }

          uv run --locked alembic upgrade head
          check_at_head

          uv run --locked alembic downgrade base
          after_downgrade="$(uv run --locked alembic current)"
          if [[ -n "${after_downgrade}" ]]; then
            echo "::error::Expected no revision after downgrading to base, found '${after_downgrade}'."
            exit 1
          fi
          echo "Downgraded to base."

          uv run --locked alembic upgrade head
          check_at_head

      - name: Run PostgreSQL integration tests
        id: tests
        env:
          RESEARCHPILOT_TEST_DATABASE_URL: ${{ env.CI_TEST_DATABASE_URL }}
        run: uv run --locked pytest -m postgres -ra --junit-xml=reports/ci/junit.xml

      # Fails unless every collected PostgreSQL test ran: a missing URL or a wrong marker
      # must never pass as a green job with zero tests or skipped tests.
      - name: Summarize and verify PostgreSQL test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          uv run --locked python - <<'EOF'
          import os
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          junit = Path("reports/ci/junit.xml")


          def report(lines: list[str]) -> None:
              text = "\n".join(lines) + "\n"
              print(text, end="")
              with summary.open("a", encoding="utf-8") as out:
                  out.write(text)


          def fail(message: str) -> None:
              print(f"::error::{message}")
              report([f"**{message}**"])
              sys.exit(1)


          collected = subprocess.run(
              [sys.executable, "-m", "pytest", "-m", "postgres", "--collect-only", "-q",
               "-p", "no:cacheprovider"],
              capture_output=True,
              text=True,
          )
          expected = sum("::" in line for line in collected.stdout.splitlines())
          if expected == 0:
              fail("No tests carry the 'postgres' marker; nothing would be checked.")

          if not junit.is_file():
              fail("The test command ran but produced no JUnit report at reports/ci/junit.xml.")
          try:
              root = ET.parse(junit).getroot()
          except ET.ParseError:
              fail("The JUnit report at reports/ci/junit.xml could not be parsed.")
          suites = [suite for suite in root.iter("testsuite") if suite.find("testsuite") is None]
          if not suites:
              fail("The JUnit report at reports/ci/junit.xml contains no test suites.")
          keys = ("tests", "failures", "errors", "skipped")
          totals = {key: sum(int(suite.get(key) or 0) for suite in suites) for key in keys}

          report([
              "| Collected | Tests in report | Failures | Errors | Skipped |",
              "|---|---|---|---|---|",
              "| {collected} | {tests} | {failures} | {errors} | {skipped} |".format(
                  collected=expected, **totals
              ),
          ])
          if totals["tests"] != expected:
              fail(f"{expected} PostgreSQL tests were collected but {totals['tests']} were reported.")
          if totals["skipped"]:
              fail(f"{totals['skipped']} PostgreSQL tests were skipped; all must run in this job.")
          EOF

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-tests-ubuntu-24.04-py3.13
          path: reports/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  package-build:
    name: Package build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Builds with the hatchling backend declared in pyproject.toml; the project's runtime
      # dependencies are neither resolved nor installed, so uv.lock is not touched.
      - name: Build the source distribution and wheel
        run: uv build --out-dir dist

      # Every Alembic migration file in the source tree must be in the wheel at the same
      # package path, or `alembic upgrade head` fails for anyone installing the package.
      - name: Verify the wheel contains the Alembic migrations
        run: |
          uv run --no-project python -I - <<'EOF'
          import sys
          import zipfile
          from pathlib import Path


          def fail(message: str) -> None:
              print(f"::error::{message}")
              sys.exit(1)


          dist = Path("dist")
          wheels = sorted(dist.glob("researchpilot-*.whl"))
          sdists = sorted(dist.glob("researchpilot-*.tar.gz"))
          if len(wheels) != 1:
              fail(f"Expected one researchpilot wheel in dist/, found {len(wheels)}.")
          if len(sdists) != 1:
              fail(f"Expected one researchpilot source distribution in dist/, found {len(sdists)}.")

          # The wheel maps src/researchpilot/... to researchpilot/... (tool.hatch packages).
          source = Path("src/researchpilot/history/migrations")
          required = sorted(
              "researchpilot/" + path.relative_to("src/researchpilot").as_posix()
              for path in source.rglob("*")
              if path.is_file()
              and "__pycache__" not in path.parts
              and path.suffix in {".py", ".mako"}
          )
          if not any(name.endswith("/script.py.mako") for name in required):
              fail("The source tree has no Alembic script.py.mako; check the migration layout.")
          if not any("/versions/" in name for name in required):
              fail("The source tree has no Alembic revision files; check the migration layout.")

          with zipfile.ZipFile(wheels[0]) as wheel:
              contents = set(wheel.namelist())
          missing = [name for name in required if name not in contents]
          if missing:
              fail(f"{wheels[0].name} is missing migration files: {', '.join(missing)}")

          print(f"{wheels[0].name} and {sdists[0].name} built.")
          print(f"All {len(required)} migration files are in the wheel:")
          for name in required:
              print(f"  {name}")
          EOF

      # Installs the wheel into a throwaway virtual environment on this runner with exactly
      # the locked runtime dependencies (hash-checked), then imports the API and CLI and
      # finds the migrations through the installed package. Nothing is deployed or kept.
      - name: Smoke-test the installed wheel with locked dependencies
        run: |
          smoke="${RUNNER_TEMP}/wheel-smoke"
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            --output-file "${RUNNER_TEMP}/runtime-requirements.txt"
          uv venv "${smoke}" --python 3.13
          uv pip install --python "${smoke}" --require-hashes \
            --requirement "${RUNNER_TEMP}/runtime-requirements.txt"
          uv pip install --python "${smoke}" --no-deps dist/researchpilot-*.whl
          uv pip check --python "${smoke}"
          "${smoke}/bin/python" -I - <<'EOF'
          from importlib.resources import files

          import researchpilot.api.app  # noqa: F401 - the API imports from the installed wheel
          import researchpilot.cli  # noqa: F401

          migrations = files("researchpilot.history") / "migrations"
          revisions = sorted(p.name for p in (migrations / "versions").iterdir() if p.name.endswith(".py"))
          if not (migrations / "script.py.mako").is_file() or not revisions:
              raise SystemExit("::error::The installed package has no Alembic migrations.")
          print(f"Installed package imports; migrations found: {', '.join(revisions)}")
          EOF
          "${smoke}/bin/researchpilot" --help > /dev/null
          echo "The researchpilot console script runs."

      - name: Upload the built distributions
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: researchpilot-dist
          path: dist/
          if-no-files-found: warn
          retention-days: 14

# Continuous integration: lint, format and offline tests.
#
# Uses only the committed uv.lock (`--locked` fails if it is out of date; it is never
# regenerated here). Offline tests use fake models, web clients and history: no Ollama,
# MCP server, database, paid API or secret is used. PostgreSQL and live tests are
# deselected by marker and are also skipped unless their opt-in variables are set.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Every job declares its own permissions; nothing is granted by default.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Replace superseded pull-request runs; never cancel runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.26"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint and format (Ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

  offline-tests:
    name: Offline tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux, Python 3.12
            os: ubuntu-24.04
            python: "3.12"
          - label: Linux, Python 3.13
            os: ubuntu-24.04
            python: "3.13"
          # Development happens on Windows; some path-safety tests only run there.
          - label: Windows, Python 3.13
            os: windows-2025
            python: "3.13"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run offline tests (coverage is informational)
        id: tests
        run: >-
          uv run --locked pytest
          -m "not postgres and not live and not live_mcp"
          -ra
          --junit-xml=reports/ci/junit.xml
          --cov=researchpilot
          --cov-report=term
          --cov-report=xml:reports/ci/coverage.xml

      # Runs whenever the test command ran, passed or failed; fails only when the JUnit
      # report is missing or unreadable (the test step itself reports test failures).
      - name: Summarize test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          uv run --locked python - <<'EOF'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          junit = Path("reports/ci/junit.xml")


          def report(lines: list[str]) -> None:
              text = "\n".join(lines) + "\n"
              print(text, end="")
              with summary.open("a", encoding="utf-8") as out:
                  out.write(text)


          def fail(message: str) -> None:
              print(f"::error::{message}")
              report([f"**{message}**"])
              sys.exit(1)


          if not junit.is_file():
              fail("The test command ran but produced no JUnit report at reports/ci/junit.xml.")
          try:
              root = ET.parse(junit).getroot()
          except ET.ParseError:
              fail("The JUnit report at reports/ci/junit.xml could not be parsed.")

          # The root is either one <testsuite> or a <testsuites> holding one or more suites.
          # Only innermost suites are counted, so nested suites are never counted twice.
          suites = [suite for suite in root.iter("testsuite") if suite.find("testsuite") is None]
          if not suites:
              fail("The JUnit report at reports/ci/junit.xml contains no test suites.")
          keys = ("tests", "failures", "errors", "skipped")
          totals = {key: sum(int(suite.get(key) or 0) for suite in suites) for key in keys}

          report([
              "| Tests in report | Failures | Errors | Skipped by pytest |",
              "|---|---|---|---|",
              "| {tests} | {failures} | {errors} | {skipped} |".format(**totals),
              "",
              "Tests deselected by marker (postgres, live, live_mcp) are excluded on purpose:",
              "they are not run, not in the report and not counted above.",
          ])
          EOF

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-tests-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            reports/ci/junit.xml
            reports/ci/coverage.xml
          if-no-files-found: warn
          retention-days: 14

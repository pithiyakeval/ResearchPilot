# Alembic configuration for the ResearchPilot research history schema.
#
# Migrations are applied explicitly, from this directory:
#   uv run alembic upgrade head
# The database URL comes from RESEARCHPILOT_DATABASE_URL (or .env); it is never stored here.

[alembic]
script_location = %(here)s/src/researchpilot/history/migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
